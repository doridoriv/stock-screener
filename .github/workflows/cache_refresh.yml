name: Refresh stock screener caches

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ✅ 1. 라이브러리 설치 (FinanceDataReader 패키지명 오류 수정 및 분리)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance
          pip install finance-datareader
          pip install requests beautifulsoup4 lxml streamlit

      # ✅ 2. data 폴더 생성 로직 유지
      - name: Create data directory
        run: |
          mkdir -p data

      # ✅ 3. 파이썬 스크립트 실행 및 캐시 복사 로직 유지
      - name: Refresh caches
        run: |
          python - <<'PY'
          import analyzer
          import os
          import shutil

          # 한국 시장 캐시 생성
          analyzer.refresh_kr_fundamental_cache('한국(코스피)', top_n=100, sleep_seconds=0.2)
          analyzer.refresh_kr_fundamental_cache('한국(코스닥)', top_n=100, sleep_seconds=0.2)

          # 미국 시장 캐시
          analyzer.load_us_market_cap_cache()

          # cache → data 폴더로 JSON 파일 복사
          if os.path.exists("cache"):
              for file in os.listdir("cache"):
                  if file.endswith(".json"):
                      shutil.copy(os.path.join("cache", file), os.path.join("data", file))
          PY

      # ✅ 4. 업데이트된 캐시 커밋 및 푸시 (새 파일 감지 버그 수정본 유지)
      - name: Commit cache updates
        run: |
          # Git 유저 정보 설정
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 새로 생성되거나 변경된 캐시 파일들을 스테이징 영역에 먼저 추가 (중요)
          git add cache/*.json data/*.json || true
          
          # 스테이징된 변경 사항이 있는지 확인 후 커밋/푸시
          if git diff --cached --quiet; then
            echo 'No cache changes to commit.'
            exit 0
          fi
          
          git commit -m 'chore: refresh screener caches'
          git push
