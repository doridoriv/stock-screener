name: Daily stock screening

on:
  push:
    branches:
      - main
    paths-ignore:
      - "cache/**"
  schedule:
    # US: after 20:00 New York post-market close.
    - cron: "30 1 * * 2-6"
    # Korea: after KRX after-hours/NXT evening session window.
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
    inputs:
      markets:
        description: "Markets to screen for a manual run"
        required: true
        default: "US"
        type: choice
        options:
          - "US"
          - "KR"
          - "ALL"
      top_n:
        description: "Number of symbols per market for a manual run"
        required: true
        default: "5"
      save_cache:
        description: "Save and commit cache files"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check data source coverage
        continue-on-error: true
        run: python data_source_check.py

      - name: Run daily screening
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 1 * * 2-6" ]; then
            SCREENING_MARKETS=US SCREENING_FORCE_SCRAPE=false python cron_job.py
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 11 * * 1-5" ]; then
            SCREENING_MARKETS=KR SCREENING_FORCE_SCRAPE=false python cron_job.py
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SCREENING_MARKETS="${{ inputs.markets }}" SCREENING_TOP_N="${{ inputs.top_n }}" SCREENING_SAVE_CACHE="${{ inputs.save_cache }}" python cron_job.py
          else
            SCREENING_MARKETS=ALL SCREENING_FORCE_SCRAPE=false python cron_job.py
          fi

      - name: Commit updated cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.save_cache == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/snapshot_*.csv cache/*.json
          git diff --cached --quiet || git commit -m "Update daily screening cache"
          git push
